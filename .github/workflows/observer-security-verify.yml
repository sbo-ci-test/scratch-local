# observer security verify: the required workflow (security pillar plan 7.9,
# phase F1 "verify-lite"). Generated by `observer security verify template`;
# see docs/security-verify.md for setup. Rendered with a placeholder version
# and vendor key, then the fetch step was replaced (see the comment there).
#
# WHEN THIS CHECK BINDS. It binds only when this file lives in a separate,
# protected repository (sbo-ci-test/policy) and an organization ruleset runs
# it as a REQUIRED WORKFLOW on the repositories it guards: a pull request
# cannot then edit the job, its binary or its policy. Copied into the
# repository under test it is ADVISORY ONLY: a pull request can rewrite it
# under the same job name.
#
# What it does: the verdict job checks out the pull request as data (it never
# runs anything from it), fetches the observer release pinned below by version,
# SHA-256 and vendor Ed25519 signature, reads the policy from the protected
# repository at a pinned commit, and runs `observer security verify`. It holds
# no secrets and a read-only token. The upload job only consumes the verdict
# job's SARIF artifact; an upload failure (a fork's read-only token) is a
# warning, never the verdict.
name: observer-security-verify

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  verify:
    name: observer security verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the change as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Check out the protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sbo-ci-test/policy
          ref: afe2f4ae72995f61e9d8f43ddc10f5f2b6e1abe4
          persist-credentials: false
          path: policy

      # KNOWN DIFFERENCE from Observer's shipped template (internal/secverify
      # template.go): the shipped step fetches a vendor-signed release archive
      # and checks both its SHA-256 and its Ed25519 vendor signature. This
      # acceptance run uses an unreleased plan-branch build that has no vendor
      # signature, so the signature check is replaced by this SHA-256 pin
      # alone. The pin is weaker than the signature: whoever controls this
      # policy repository controls the pin.
      - name: Fetch and verify the pinned observer build (sha256 pin only)
        env:
          VERIFY_URL: https://github.com/sbo-ci-test/policy/releases/download/observer-1edaa3ef2/observer-1edaa3ef2-linux-amd64
          VERIFY_SHA256: 52c48f25b4277fb4e26d47971b19862e8dd5ff6855fcd226ea9da244979fc35c
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/observer"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 -o observer.download "$VERIFY_URL"
          echo "$VERIFY_SHA256  observer.download" | sha256sum --check --strict -
          mv observer.download observer
          chmod 0755 observer
          ./observer --version

      - name: Verify the change
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          VERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/observer/observer" security verify \
            --repo target \
            --base "$VERIFY_BASE" \
            --head "$VERIFY_HEAD" \
            --policy "policy/observer-security-ci.toml" \
            --sarif observer-security.sarif

      - name: Keep the SARIF for the upload job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observer-security-sarif
          path: observer-security.sarif
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: upload SARIF to code scanning
    needs: verify
    if: always() && needs.verify.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      # code scanning's upload reads the run's metadata in a private
      # repository; neither grant can write anything.
      actions: read
      contents: read
    steps:
      - name: Fetch the verdict job's SARIF
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observer-security-sarif

      - name: Upload to code scanning (a failure here is a warning, never the verdict)
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: observer-security.sarif
          category: observer-security-verify
